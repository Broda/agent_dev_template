name: Governance Audit (Warn Only)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run governance audit (warn-only)
        shell: bash
        run: |
          echo "Running governance audit in warn-only mode..."
          if ! ./scripts/validate-governance; then
            echo "::warning::Governance audit reported failures. Warn-only mode: this does not block merge."
          else
            echo "Governance audit passed."
          fi
          exit 0
