name: Release Readiness

on:
  workflow_dispatch:

jobs:
  public-template-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install development checks
        shell: bash
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run Ruff lint and format checks
        shell: bash
        run: |
          python3 -m ruff check .
          python3 -m ruff format --check .

      - name: Verify generated artifacts are in sync
        shell: bash
        run: |
          ./scripts/render-intent-docs
          ./scripts/sync-plugin-skills
          git diff --exit-code -- \
            .harness/commands/CONVERSATIONAL_MODE.md \
            .harness/commands/COMMANDS.md \
            .harness/commands/harness_manifest.json \
            .agents/plugins/marketplace.json \
            .agents/skills/ \
            .harness/plugins/project-lifecycle-lab/skills/ \
            .harness/development/templates/docs/ \
            .harness/tests/fixtures/finalized_state_v2.json \
            .harness/tests/fixtures/finalized_state_web_app_v2.json \
            .harness/tests/fixtures/finalized_state_with_persistence_v2.json

      - name: Run governance validation
        shell: bash
        run: ./scripts/validate-governance

      - name: Run full unit suite
        shell: bash
        run: python3 -m unittest discover -s .harness/tests -v

      - name: Run plugin package smoke
        shell: bash
        run: python3 .harness/plugins/project-lifecycle-lab/smoke_package.py .harness/plugins/project-lifecycle-lab

      - name: Run fresh copy smoke
        shell: bash
        run: |
          tmpdir="$(mktemp -d)"
          ./scripts/project-harness new "$tmpdir/harness-smoke" --no-git
          "$tmpdir/harness-smoke/scripts/validate-governance"

      - name: Run finalize and render fixture smoke
        shell: bash
        run: |
          python3 -m unittest discover -s .harness/tests -p "test_finalization_regression.py" -v
          python3 -m unittest discover -s .harness/tests -p "test_development_rendering.py" -v

      - name: Run update dry-run and apply smoke
        shell: bash
        run: |
          source="$(mktemp -d)"
          project="$(mktemp -d)"
          cp -a . "$source/template"
          "$source/template/scripts/project-harness" new "$project/harness-smoke" --no-git
          cp "$source/template/MODE.md" "$project/harness-smoke/MODE.md"
          printf '\n# release readiness update smoke\n' >> "$source/template/scripts/lab.sh"
          (
            cd "$project/harness-smoke"
            ./scripts/project-harness update --dry-run --source-path "$source/template"
            ./scripts/project-harness update --apply --source-path "$source/template" --yes
            ./scripts/validate-governance
          )
