name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify generated intent docs are in sync
        shell: bash
        run: |
          ./scripts/render-intent-docs
          git diff --stat --exit-code || {
            echo "Generated intent docs are out of sync. Run ./scripts/render-intent-docs and commit the result."
            git diff -- harness_commands/CONVERSATIONAL_MODE.md harness_commands/COMMANDS.md
            exit 1
          }

      - name: Run regression suite
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Run governance validation
        shell: bash
        run: ./scripts/validate-governance

  windows-powershell-launchers:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run PowerShell launcher smoke tests
        shell: pwsh
        run: python -m unittest tests.test_lab_launcher tests.test_project_harness_bootstrap -v

      - name: Run PowerShell project-harness update smoke
        shell: pwsh
        run: |
          function Invoke-SmokeCommand {
            param(
              [string]$Label,
              [scriptblock]$Command
            )
            $output = & $Command 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            Write-Host "----- $Label -----"
            Write-Host $output
            if ($exitCode -ne 0) { throw "$Label failed with exit code $exitCode." }
            return $output
          }

          $source = Join-Path $env:RUNNER_TEMP "template-source"
          $project = Join-Path $env:RUNNER_TEMP "windows-update-project"
          Copy-Item -Path . -Destination $source -Recurse -Force

          Push-Location $source
          ./scripts/project-harness.ps1 new $project --no-git
          Pop-Location

          Copy-Item -Path (Join-Path $source "MODE.md") -Destination (Join-Path $project "MODE.md") -Force
          Add-Content -Path (Join-Path $source "scripts/lab.sh") -Value "# windows update smoke"

          Push-Location $project
          $help = Invoke-SmokeCommand "project-harness update help" {
            ./scripts/project-harness.ps1 update --help
          }
          if ($help -notmatch "--dry-run") { throw "PowerShell update help did not reach argparse." }

          $dryRun = Invoke-SmokeCommand "project-harness update dry-run" {
            ./scripts/project-harness.ps1 update --dry-run --source-path $source
          }
          if ($dryRun -notmatch "scripts[\\/]lab.sh") { throw "Dry-run output did not include changed file." }

          $apply = Invoke-SmokeCommand "project-harness update apply" {
            ./scripts/project-harness.ps1 update --apply --source-path $source --yes
          }
          if ($apply -notmatch "scripts[\\/]lab.sh") { throw "Apply output did not include changed file." }
          if ($apply -notmatch "validate-governance: 0") { throw "Apply output did not include validation summary." }
          if ($apply -notmatch "Backup directory:") { throw "Apply output did not include backup location." }
          Pop-Location

      - name: Run PowerShell generated artifact launcher smoke
        shell: pwsh
        run: |
          function Invoke-SmokeCommand {
            param(
              [string]$Label,
              [scriptblock]$Command
            )
            $output = & $Command 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            Write-Host "----- $Label -----"
            Write-Host $output
            if ($exitCode -ne 0) { throw "$Label failed with exit code $exitCode." }
            return $output
          }

          function Assert-SameFile {
            param(
              [string]$Expected,
              [string]$Actual,
              [string]$Label
            )
            $expectedText = Get-Content -Path $Expected -Raw
            $actualText = Get-Content -Path $Actual -Raw
            if ($expectedText -ne $actualText) { throw "$Label did not match." }
          }

          function Assert-UnchangedHashes {
            param(
              [hashtable]$Before,
              [string[]]$Paths
            )
            foreach ($path in $Paths) {
              $after = (Get-FileHash -Path $path -Algorithm SHA256).Hash
              if ($Before[$path] -ne $after) { throw "Generated artifact changed on idempotence check: $path" }
            }
          }

          $work = Join-Path $env:RUNNER_TEMP "generated-launcher-smoke"
          Copy-Item -Path . -Destination $work -Recurse -Force
          Push-Location $work

          Invoke-SmokeCommand "render-intent-docs first run" {
            ./scripts/render-intent-docs.ps1
          }
          $intentPaths = @(
            "harness_commands/CONVERSATIONAL_MODE.md",
            "harness_commands/COMMANDS.md"
          )
          $intentHashes = @{}
          foreach ($path in $intentPaths) {
            $intentHashes[$path] = (Get-FileHash -Path $path -Algorithm SHA256).Hash
          }
          Invoke-SmokeCommand "render-intent-docs idempotence run" {
            ./scripts/render-intent-docs.ps1
          }
          Assert-UnchangedHashes $intentHashes $intentPaths

          Set-Content -Path "plugins/project-lifecycle-lab/skills/brainstorming-lab/SKILL.md" -Value "stale plugin copy"
          Invoke-SmokeCommand "sync-plugin-skills repair" {
            ./scripts/sync-plugin-skills.ps1
          }
          Assert-SameFile `
            ".agents/skills/brainstorming-lab/SKILL.md" `
            "plugins/project-lifecycle-lab/skills/brainstorming-lab/SKILL.md" `
            "Plugin skill mirror"

          Copy-Item -Path "tests/fixtures/finalized_state_with_persistence_v2.json" -Destination "state/project-init.json" -Force
          Invoke-SmokeCommand "render-development-docs first run" {
            ./scripts/render-development-docs.ps1
          }
          $developmentPaths = @(
            "README.md",
            "docs/PROJECT_CONTEXT.md",
            "docs/ROADMAP.md",
            ".github/workflows/ci.yml"
          )
          $developmentHashes = @{}
          foreach ($path in $developmentPaths) {
            $developmentHashes[$path] = (Get-FileHash -Path $path -Algorithm SHA256).Hash
          }
          Invoke-SmokeCommand "render-development-docs idempotence run" {
            ./scripts/render-development-docs.ps1
          }
          Assert-UnchangedHashes $developmentHashes $developmentPaths
          Pop-Location

      - name: Run governance through PowerShell launcher
        shell: pwsh
        run: ./scripts/validate-governance.ps1
